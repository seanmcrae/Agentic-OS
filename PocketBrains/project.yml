# PocketBrains — XcodeGen project definition.
# Generate the .xcodeproj with:  xcodegen generate
# (brew install xcodegen)
name: PocketBrains
options:
  bundleIdPrefix: com.pocketbrains
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  PocketBrains:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketbrains.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMotionUsageDescription: "Device motion drives the lighting inside the glass material."
        INFOPLIST_KEY_CFBundleDisplayName: PocketBrains
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_SWIFT_FLAGS: "$(inherited)"
        # To enable the optional MLX backend (larger open models on Pro devices):
        #   1. Add the package below under `packages:` and `dependencies:`.
        #   2. Append `-D POCKETBRAINS_MLX` to OTHER_SWIFT_FLAGS.
        # packages:
        #   MLXLibraries:
        #     url: https://github.com/ml-explore/mlx-swift-examples
        #     from: 2.25.0
        # dependencies: [package: MLXLibraries, products: [MLXLLM, MLXLMCommon]]
